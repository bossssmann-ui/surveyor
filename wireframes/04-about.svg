<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450">
  <rect width="1280" height="450" fill="#f8f8f8"/>

  <!-- Section title left-aligned -->
  <text x="80" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333">Почему выбирают нас</text>
  <rect x="80" y="70" width="200" height="8" rx="4" fill="#ccc"/>

  <!-- Left column: 4 advantage items -->
  <!-- Item 1 -->
  <circle cx="110" cy="130" r="22" fill="#1a5632" opacity="0.15"/>
  <circle cx="110" cy="130" r="11" fill="#1a5632"/>
  <text x="145" y="127" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Опыт более 15 лет</text>
  <rect x="145" y="138" width="280" height="6" rx="3" fill="#ccc"/>
  <rect x="145" y="152" width="240" height="6" rx="3" fill="#ccc"/>

  <!-- Item 2 -->
  <circle cx="110" cy="210" r="22" fill="#1a5632" opacity="0.15"/>
  <circle cx="110" cy="210" r="11" fill="#1a5632"/>
  <text x="145" y="207" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Современное оборудование</text>
  <rect x="145" y="218" width="280" height="6" rx="3" fill="#ccc"/>
  <rect x="145" y="232" width="240" height="6" rx="3" fill="#ccc"/>

  <!-- Item 3 -->
  <circle cx="110" cy="290" r="22" fill="#1a5632" opacity="0.15"/>
  <circle cx="110" cy="290" r="11" fill="#1a5632"/>
  <text x="145" y="287" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Лицензированные специалисты</text>
  <rect x="145" y="298" width="280" height="6" rx="3" fill="#ccc"/>
  <rect x="145" y="312" width="240" height="6" rx="3" fill="#ccc"/>

  <!-- Item 4 -->
  <circle cx="110" cy="370" r="22" fill="#1a5632" opacity="0.15"/>
  <circle cx="110" cy="370" r="11" fill="#1a5632"/>
  <text x="145" y="367" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Гарантия результата</text>
  <rect x="145" y="378" width="280" height="6" rx="3" fill="#ccc"/>
  <rect x="145" y="392" width="240" height="6" rx="3" fill="#ccc"/>

  <!-- Right column: image placeholder -->
  <rect x="640" y="100" width="560" height="310" rx="8" fill="#fff" stroke="#ccc"/>
  <line x1="640" y1="100" x2="1200" y2="410" stroke="#ccc" stroke-width="1"/>
  <line x1="1200" y1="100" x2="640" y2="410" stroke="#ccc" stroke-width="1"/>
  <text x="920" y="260" font-family="Arial, sans-serif" font-size="16" fill="#aaa" text-anchor="middle">Изображение</text>
</svg>