<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <rect width="1280" height="600" fill="#f8f8f8"/>

  <!-- Header bar -->
  <rect width="1280" height="64" fill="#1a5632"/>
  <rect x="40" y="18" width="28" height="28" rx="4" fill="#d4a843"/>
  <text x="78" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">ГеоПримор</text>
  <text x="780" y="40" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Услуги</text>
  <text x="860" y="40" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">О нас</text>
  <text x="930" y="40" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Оборудование</text>
  <text x="1060" y="40" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Отзывы</text>
  <text x="1150" y="40" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Контакты</text>

  <!-- Hero section background -->
  <rect y="64" width="1280" height="536" fill="#1a5632"/>

  <!-- Hero content centered -->
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#fff" text-anchor="middle">Геодезические изыскания</text>
  <rect x="390" y="220" width="500" height="10" rx="5" fill="rgba(255,255,255,0.3)"/>

  <!-- Buttons -->
  <rect x="440" y="260" width="180" height="48" rx="24" fill="#d4a843"/>
  <text x="530" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Оставить заявку</text>
  <rect x="640" y="260" width="180" height="48" rx="24" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="730" y="290" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">Наши услуги</text>

  <!-- Stat boxes -->
  <rect x="240" y="370" width="220" height="90" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="350" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#d4a843" text-anchor="middle">15+</text>
  <text x="350" y="435" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">лет опыта</text>

  <rect x="520" y="370" width="220" height="90" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="630" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#d4a843" text-anchor="middle">500+</text>
  <text x="630" y="435" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">проектов</text>

  <rect x="800" y="370" width="220" height="90" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="910" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#d4a843" text-anchor="middle">100%</text>
  <text x="910" y="435" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">гарантия качества</text>

  <!-- WhatsApp circle -->
  <circle cx="60" cy="560" r="24" fill="#25d366"/>
  <text x="60" y="556" font-family="Arial, sans-serif" font-size="8" fill="#fff" text-anchor="middle">What</text>
  <text x="60" y="567" font-family="Arial, sans-serif" font-size="8" fill="#fff" text-anchor="middle">sApp</text>
</svg>