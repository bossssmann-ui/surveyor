<svg xmlns="http://www.w3.org/2000/svg" width="375" height="700" viewBox="0 0 375 700">
  <rect width="375" height="700" fill="#f8f8f8"/>

  <!-- Mobile header bar -->
  <rect width="375" height="56" fill="#1a5632"/>
  <rect x="16" y="16" width="22" height="22" rx="3" fill="#d4a843"/>
  <text x="46" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">ГеоПримор</text>

  <!-- Burger menu icon -->
  <rect x="330" y="18" width="24" height="3" rx="1" fill="#fff"/>
  <rect x="330" y="26" width="24" height="3" rx="1" fill="#fff"/>
  <rect x="330" y="34" width="24" height="3" rx="1" fill="#fff"/>

  <!-- Hero section green background -->
  <rect y="56" width="375" height="644" fill="#1a5632"/>

  <!-- Hero content stacked -->
  <text x="187" y="130" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">Геодезические</text>
  <text x="187" y="162" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">изыскания</text>

  <!-- Subtitle -->
  <rect x="60" y="185" width="255" height="7" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="80" y="200" width="215" height="7" rx="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Stacked buttons full width -->
  <rect x="30" y="235" width="315" height="48" rx="24" fill="#d4a843"/>
  <text x="187" y="265" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Оставить заявку</text>

  <rect x="30" y="298" width="315" height="48" rx="24" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="187" y="328" font-family="Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle">Наши услуги</text>

  <!-- Stat boxes stacked vertically -->
  <rect x="30" y="380" width="315" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="187" y="415" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#d4a843" text-anchor="middle">15+</text>
  <text x="187" y="438" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">лет опыта</text>

  <rect x="30" y="465" width="315" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="187" y="500" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#d4a843" text-anchor="middle">500+</text>
  <text x="187" y="523" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">проектов</text>

  <rect x="30" y="550" width="315" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="187" y="585" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#d4a843" text-anchor="middle">100%</text>
  <text x="187" y="608" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">гарантия качества</text>

  <!-- WhatsApp circle bottom-left -->
  <circle cx="50" cy="660" r="22" fill="#25d366"/>
  <text x="50" y="656" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">What</text>
  <text x="50" y="666" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">sApp</text>
</svg>