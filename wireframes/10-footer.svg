  <text x="118" y="56" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">ГеоПримор</text>
  <rect x="80" y="75" width="280" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="80" y="90" width="240" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="80" y="105" width="200" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Middle column: Услуги -->
  <text x="520" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d4a843">Услуги</text>
  <rect x="520" y="75" width="140" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="520" y="90" width="130" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="520" y="105" width="150" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="520" y="120" width="120" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="520" y="135" width="145" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="520" y="150" width="135" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Right column: Навигация -->
  <text x="840" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d4a843">Навигация</text>
  <rect x="840" y="75" width="100" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="840" y="90" width="110" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="840" y="105" width="90" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="840" y="120" width="120" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="840" y="135" width="105" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Bottom divider + copyright -->
  <line x1="80" y1="190" x2="1200" y2="190" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="640" y="220" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="middle">© 2024 ГеоПримор. Все права защищены.</text>
