  <!-- Card 6 -->
  <rect x="840" y="240" width="350" height="110" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="1015" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Большой Камень</text>
