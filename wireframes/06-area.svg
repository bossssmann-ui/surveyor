<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <rect width="1280" height="400" fill="#f8f8f8"/>

  <!-- Section title -->
  <text x="640" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333" text-anchor="middle">Регион работ</text>
  <rect x="515" y="65" width="250" height="8" rx="4" fill="#ccc"/>

  <!-- Row 1 -->
  <!-- Card 1 — highlighted -->
  <rect x="80" y="100" width="350" height="110" rx="8" fill="#fff" stroke="#1a5632" stroke-width="2"/>
  <rect x="80" y="100" width="120" height="24" rx="4" fill="#1a5632"/>
