  <rect x="930" y="165" width="170" height="6" rx="3" fill="#ccc"/>

  <!-- Row 2 -->
  <!-- Card 4 -->
  <rect x="80" y="240" width="350" height="110" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="255" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Артём</text>
